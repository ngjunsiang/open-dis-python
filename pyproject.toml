[project]
name = "opendis"
version = "1.1.0a8"
description='implementation of DIS, IEEE-1278.1'
authors = [
    {name="Don McGregor", email="mcgredo@nps.edu"},
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
repository = 'https://github.com/open-dis/open-dis-python'
documentation = "https://open-dis.org/"
classifiers=[
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator"
 ]
 dependencies = [
    "numpy (>=1.26.4,<3.0)",
 ]

# Optional runtime enhancement, not a requirement: when installed, the
# siso-ref-010-python data package can feed the enum hook
# (opendis.enum_registry.register_enum_factory) so parsed SISO values
# resolve to rich enum members; without it, parsing yields plain ints.
[project.optional-dependencies]
ref010 = [
    "siso-ref-010-python @ git+https://github.com/ngjunsiang/siso-ref-010-python.git@0.10.1",
]


[tool.poetry.group.dev.dependencies]
black = ">=24.0.0"
isort = ">=5.13.2"
commitizen = ">=3.13.0"
flake8 = ">=7.0.0"
flake8-bugbear = "^24.8.0"
flake8-print = "^5.0.0"
flake8-docstrings = "^1.7.0"
flake8-docstrings-complete = "^1.3.0"
docformatter = {extras = ["tomli"], version = "^1.7.5"}
pytest = "^8"
pytest-cov = "^4"

# Generation tooling is deliberately NOT a dependency: opendis.record
# and opendis.bitfields are regenerated by the pinned
# submodules/open-dis-python-generator submodule (which owns its own
# spec/REF-010 input pins) — see "Code generation (dis7-ng)" in
# README.md. CI needs only `poetry install --with dev`.

[tool.commitizen]
version = "1.1.0a8"
update_changelog_on_bump = false
changelog_merge_prerelease = false
bump_message = "bump: $current_version → $new_version"
version_files = [
    "pyproject.toml:^version",
    ".env:^version"
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
